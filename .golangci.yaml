version: "2"
run:
  timeout: 5m
  build-tags:
    - unit
    - integration
    - wireinject

linters:
  settings:
    staticcheck:
      # v1 ran staticcheck and gosimple only; v2 also folds in stylecheck (ST) and quickfix (QF).
      checks: ["all", "-ST*", "-QF*"]
  exclusions:
    # The default exclusions golangci-lint v1 applied implicitly.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
    - "mock"
    - "_gen.go$"
    - "pb.go$"
    - "pb.gw.go$"

formatters:
  enable:
    - goimports
  exclusions:
    paths:
    - "mock"
    - "_gen.go$"
    - "pb.go$"
    - "pb.gw.go$"
