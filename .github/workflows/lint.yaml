name: Lint
on: pull_request
jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Golang lint
        run: |
          make lint/go
      - name: Protobuf lint
        run: |
          make lint/protobuf
      - name: License check
        run: |
          make license-check
